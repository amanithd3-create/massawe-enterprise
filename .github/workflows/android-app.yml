name: Build MASSAWE ENTERPRISE Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.jsx"
      - "main.js"
      - "main.css"
      - "style.css"
      - "index.html"
      - "package.json"
      - "vite.config.js"
      - "capacitor.config.json"
      - ".github/workflows/android-app.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Build web app for Android
        run: npm run build
        env:
          CAPACITOR_BUILD: "true"

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android test APK and release bundle
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

      - name: Upload Android build files
        uses: actions/upload-artifact@v4
        with:
          name: massawe-enterprise-android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
